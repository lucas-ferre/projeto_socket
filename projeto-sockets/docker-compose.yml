services:
  # ==================================================================
  # 1. GATEWAY INTELIGENTE (HUB COORDENADOR)
  # ==================================================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        TARGET_SERVICE: gateway
    container_name: gateway
    ports:
      - "5000:5000/udp"  # Ingestão de telemetria contínua
      - "5001:5001/tcp"  # Interface de streaming analítico e atuação
      - "5002:5002/udp"  # Registro de descoberta de sensores externos
      - "5005:5005/udp"  # Canal multicast de descoberta de topologia
    volumes:
      - gateway_db:/app/db
    environment:
      - PYTHONUNBUFFERED=1  # Garante que os logs sejam exibidos em tempo real (comportamento equivalente aos sensores C, Lua e Java)
    networks:
      - smart_city_net
    restart: always
    # Implementação de checagem ativa de prontidão na camada de transporte
    healthcheck:
      test: [
        "CMD-SHELL", 
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5001)); s.close()' || exit 1"
      ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ==================================================================
  # 2. SENSOR DE CLIMA (NÓ C - CONTÍNUO)
  # ==================================================================
  sensor_clima:
    environment:
    - C_DEVICE_COUNT=6  # Configura o número de dispositivos simulados (ajustável sem recompilação)
    build:
      context: .
      dockerfile: sensor_c/Dockerfile
      args:
        TARGET_SERVICE: sensor_clima
    container_name: sensor_clima
    # Condiciona a inicialização à integridade atestada do coordenador
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    healthcheck:
      test: [
        "CMD-SHELL",
        "test -r /proc/1/cmdline && grep -zq sensor_c /proc/1/cmdline"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 3. POSTE INTELIGENTE (NÓ LUA - CONTROLÁVEL)
  # ==================================================================
  sensor_posto:
    build:
      context: .
      dockerfile: sensor_lua/Dockerfile
      args:
        TARGET_SERVICE: sensor_posto
    container_name: sensor_posto
    # Garante que o nó só despache a descoberta quando o Gateway puder ouvir
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    healthcheck:
      test: [
        "CMD-SHELL",
        "bash -c '</dev/tcp/127.0.0.1/5002'"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# ==================================================================
  # 4. SEMAFORO (NÓ JAVA - CONTÍNUO)
  # ==================================================================
  sensor_java:
    build:
      context: .
      dockerfile: sensor_java/Dockerfile
      args:
        TARGET_SERVICE: sensor_java
    container_name: sensor_semaforo
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    healthcheck:
      test: [
        "CMD-SHELL",
        "bash -c '</dev/tcp/127.0.0.1/5003'"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 5. CÂMERA DE TRÁFEGO (NÓ PYTHON - CONTROLÁVEL)
  # ==================================================================
  sensor_camera:
    build:
      context: .
      dockerfile: sensor_python/Dockerfile
      args:
        TARGET_SERVICE: sensor_camera
    container_name: sensor_camera
    environment:
      - PYTHONUNBUFFERED=1  # Força flush imediato do stdout/stderr (comportamento equivalente aos sensores C, Lua e Java)
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5004)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 6. CLIENTE ANALÍTICO (DASHBOARD STREAMLIT)
  # ==================================================================
  dashboard:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        TARGET_SERVICE: dashboard
    container_name: dashboard
    ports:
      - "8501:8501" # Interface visual exposta
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 8501)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  smart_city_net:
    driver: bridge

volumes:
  gateway_db:
