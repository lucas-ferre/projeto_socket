services:
  # ==================================================================
  # 1. GATEWAY INTELIGENTE (HUB COORDENADOR)
  # ==================================================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        TARGET_SERVICE: gateway
    container_name: gateway
    ports:
      - "5000:5000/udp"  # Ingestão de telemetria contínua
      - "5001:5001/tcp"  # Interface de streaming analítico e atuação
      - "5002:5002/udp"  # Registro de descoberta de sensores externos
      - "5005:5005/udp"  # Canal multicast de descoberta de topologia
    volumes:
      - gateway_db:/app/gateway/db
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - smart_city_net
    restart: always
    # asyncio cancela tasks e fecha o pool SQLite no SIGTERM —
    # 10s garante que o WAL checkpoint final seja escrito antes do SIGKILL.
    stop_grace_period: 10s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5001)); s.close()' || exit 1"
      ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ==================================================================
  # 2. SENSOR DE CLIMA (NÓ C - CONTÍNUO)
  # ==================================================================
  sensor_clima:
    build:
      context: .
      dockerfile: sensor_c/Dockerfile
      args:
        TARGET_SERVICE: sensor_clima
    container_name: sensor_clima
    environment:
      - C_DEVICE_COUNT=6  # Número de dispositivos simulados (ajustável sem recompilação)
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # sig_atomic_t keep_running + sigaction(SIGTERM) garantem saída limpa em < 1s.
    stop_grace_period: 5s
    healthcheck:
      # O sensor C não expõe nenhuma porta TCP (não controlável).
      # kill -0 verifica se PID 1 existe e está responsivo a sinais —
      # mais robusto que inspecionar /proc/1/cmdline, que passaria para
      # qualquer processo cujo nome contenha "sensor_c".
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 3. POSTE INTELIGENTE (NÓ LUA - CONTROLÁVEL)
  # ==================================================================
  sensor_posto:
    build:
      context: .
      dockerfile: sensor_lua/Dockerfile
      args:
        TARGET_SERVICE: sensor_posto
    container_name: sensor_posto
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # posix.signal(SIGTERM) via luaposix seta keep_running=false;
    # teardown envia STATUS_OFF e fecha sockets em < 1s.
    stop_signal: SIGTERM
    stop_grace_period: 5s
    healthcheck:
      # CONTROL_TCP_PORT = 5006 (sensor_lua/sensor.lua)
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5006'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 4. SEMÁFORO (NÓ JAVA - CONTROLÁVEL)
  # ==================================================================
  sensor_java:
    build:
      context: .
      dockerfile: sensor_java/Dockerfile
      args:
        TARGET_SERVICE: sensor_java
    container_name: sensor_semaforo
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # Thread.interrupt() propaga para os loops de telemetria e TCP,
    # encerrando ordenadamente em < 1s.
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5003'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 5. CÂMERA DE TRÁFEGO (NÓ PYTHON - CONTROLÁVEL)
  # ==================================================================
  sensor_camera:
    build:
      context: .
      dockerfile: sensor_python/Dockerfile
      args:
        TARGET_SERVICE: sensor_camera
    container_name: sensor_camera
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # signal.signal(SIGTERM) seta shutdown_event; threads encerram em < 1s.
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5004)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 6. CLIENTE ANALÍTICO (DASHBOARD STREAMLIT)
  # ==================================================================
  dashboard:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        TARGET_SERVICE: dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 8501)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  smart_city_net:
    driver: bridge

volumes:
  gateway_db: